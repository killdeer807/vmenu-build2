name: Build vMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore vMenu.sln

      - name: Build Release
        run: msbuild vMenu.sln /p:Configuration=Release /m

      - name: Show build files
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter "*.dll" | Select-Object FullName

      - name: Upload compiled output
        uses: actions/upload-artifact@v4
        with:
          name: vmenu-compiled
          path: |
            **/*.dll
            **/*.pdb
            **/*.config
